[project]
name = "thinknxg_docs"
authors = [{ name = "Kreatao", email = "kreataothinkcadd@gmail.com" }]
description = "thinkNXG documentation wiki — imports and rebrands upstream docs into thinkNXG spaces"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # requests and markdown2 are already installed with Frappe
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
